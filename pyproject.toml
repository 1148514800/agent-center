[project]
name = "agent-center"
version = "0.1.0"
description = "Local, auditable coordinator for configured coding agents"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "prompt-toolkit>=3.0.50,<4",
]

[project.scripts]
agent-center = "agent_center.cli:main"

[dependency-groups]
dev = ["mypy>=1.15,<2", "pytest>=8.3,<9", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_center"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["live: makes an explicitly authorized real CLI/API call"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
